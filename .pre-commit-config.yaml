# Run automatically on every ``git commit``. Install once:
#
#     pip install pre-commit
#     pre-commit install
#
# Run all hooks against the entire repo (not just staged files):
#
#     pre-commit run --all-files
#
# Run the manual-stage test hook explicitly (slower; not on every commit):
#
#     pre-commit run --hook-stage manual --all-files pytest-core
#
# Hooks below cover four layers:
#   1. Cheap file-shape checks (whitespace, EOF, large files, debug-stmt).
#   2. ruff — PEP 8 / pyflakes lint + import sorting (auto-fix),
#      replacing flake8 + PyCQA isort (issue #63). Config in ``ruff.toml``.
#   3. pylint — full lint at 10/10 (own venv with runtime deps).
#   4. pytest -m core — core test suite (manual stage; opt-in).

repos:
  # 1. File-level hygiene (built-in pre-commit hooks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: debug-statements

  # 2. ruff — fast lint + import sorting (issue #63). Replaces flake8
  #    and PyCQA isort; pylint keeps the semantic checks. Project
  #    config in ``ruff.toml`` (parity rule set, 120-char lines).
  #    ``rev`` kept in lock-step with setup.py / requirements.txt so
  #    pre-commit and ``pip install -e ".[dev]"`` resolve to the
  #    same version. ``--fix`` mirrors the old isort behavior:
  #    mechanical findings get fixed, not rejected.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(fractal|tests|examples)/

  # 3. pylint — heavyweight static analysis. Runs in pre-commit's
  #    own virtualenv (``language: python``) and pulls fractal's
  #    runtime deps + pylint via ``additional_dependencies`` so it
  #    can resolve imports during analysis. The git-hook subprocess
  #    does NOT inherit the user's active venv — using
  #    ``language: system`` here would call the system ``python3``
  #    where pylint isn't installed.
  - repo: local
    hooks:
      # additional_dependencies pinned to the same floors as
      # setup.py::DEV_REQUIRES + RUNTIME_REQUIRES so the pylint
      # toolchain pre-commit runs against matches what CI installs
      # via ``pip install -e ".[dev]"``. Keep both lists in sync.
      - id: pylint
        name: pylint (fractal/)
        entry: pylint fractal/ --disable=R --score=no
        language: python
        pass_filenames: false
        types: [python]
        files: ^fractal/
        additional_dependencies:
          - pylint>=4.0.9
          - mlflow>=3.16.0
          - pandas>=2.3.3
          - numpy>=2.2.6
          - loguru>=0.7.3
          - requests>=2.34.2
          - scikit-learn>=1.7.2

      - id: pylint-tests
        name: pylint (tests/)
        entry: pylint --rcfile=tests/.pylintrc tests/ --disable=R --score=no
        language: python
        pass_filenames: false
        types: [python]
        files: ^tests/
        additional_dependencies:
          - pylint>=4.0.9
          - pytest>=9.1.1
          - mlflow>=3.16.0
          - pandas>=2.3.3
          - numpy>=2.2.6
          - loguru>=0.7.3
          - requests>=2.34.2
          - scikit-learn>=1.7.2

  # 4. pytest -m core — full offline test suite (~1100 tests, ~10s).
  #    Lives on the ``manual`` stage so it does NOT fire on every
  #    ``git commit`` (would slow commits down and require all
  #    runtime + test deps in pre-commit's isolated venv). Run
  #    explicitly via:
  #
  #        pre-commit run --hook-stage manual --all-files pytest-core
  #
  #    Or, more naturally, in your active venv:
  #
  #        pytest -m core
  #
  #    CI should run the suite directly on every PR.
  - repo: local
    hooks:
      - id: pytest-core
        name: pytest -m core
        entry: pytest -m core -q --no-header
        language: system
        pass_filenames: false
        types: [python]
        files: ^(fractal|tests)/.*\.py$
        stages: [manual]

      # Uses pytest-benchmark from the project ``[dev]`` extra. Kept on
      # the manual stage because timing work is intentionally outside the
      # correctness gate and must run in a controlled environment.
      - id: pytest-benchmarks
        name: pytest -m benchmark
        entry: pytest -m benchmark --benchmark-only tests/benchmarks
        language: system
        pass_filenames: false
        files: ^(fractal|tests/benchmarks)/.*\.py$
        stages: [manual]
