# Ruff (issue #63): replaces flake8 + isort for mechanical linting and
# import sorting. Pylint stays for semantic checks (cyclic imports,
# duplicate code, design smells) — ruff and pylint are complementary.
#
# Rule set is the **parity baseline** with the old toolchain:
#   * E + F + W — the pycodestyle/pyflakes surface flake8 enforced,
#     including E501 at 120 columns (the old ``max-line-length``);
#   * I — import sorting, replacing PyCQA isort;
#   * E731 ignored (lambda assignments are load-bearing for delegate calls,
#     mirroring the old .flake8 ignore).
#
# Ruff ships pycodestyle's whitespace / blank-line checks (E1/E2/E3,
# E502, W391) as preview rules. ``explicit-preview-rules`` enables only
# the codes listed in ``extend-select`` — no other preview behaviour leaks
# in. Not implemented in ruff, so lost vs flake8: E126/E127/E128
# continuation-line checks and W503/W504 (E126/W503/W504 were ignored by
# the old config anyway).
target-version = "py310"
line-length = 120
extend-exclude = [
    "docs",
    # These scripts inject sys.path before importing local helpers on
    # purpose — the same files PyCQA isort skipped.
    "tests/mlflow_tests/scripts",
    "tests/**/*.ipynb",
    "**/*.ipynb",
]

[lint]
# Strictness pass (issue #63 PR2): adds UP/B/SIM/RUF on top of the parity
# baseline. Rule-by-rule evaluation outcomes (documented, deliberate):
#   * RUF002/RUF003 — ambiguous-unicode flags the math/≈ characters used in
#     docstrings and comments (400+ findings); pure style, no value.
#   * UP031 — %-formatting retained deliberately: the flagged sites build
#     GraphQL/URI templates; rewriting to .format()/f-strings would require
#     brace-escaping of query braces ({} → {×2/{}), high-risk low-value churn.
# Everything else (UP006/UP035/UP045/UP007 modernization, B/SIM/RUF fixes) is
# applied in code — strict=False zips, explicit Optional, stacklevel=2,
# contextlib.suppress, ClassVar constants, narrowed test exceptions,
# raise-from, ternaries, pairwise.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "RUF002", "RUF003", "UP031"]
preview = true
explicit-preview-rules = true
extend-select = [
    "E111", "E112", "E113", "E114", "E115", "E116", "E117",
    "E201", "E202", "E203", "E204", "E211", "E221", "E222", "E223", "E224",
    "E225", "E226", "E227", "E228", "E231", "E241", "E242", "E251", "E252",
    "E261", "E262", "E265", "E266", "E271", "E272", "E273", "E274", "E275",
    "E301", "E302", "E303", "E304", "E305", "E306", "E502", "W391",
]

[lint.per-file-ignores]
# Reference examples are historically outside the flake8 hook; they keep
# their terse style (sys.path preamble before imports, semicolon
# separators, single-letter OHLCV unpacking, demo locals, long lines and
# free-form whitespace).
"examples/**" = ["E1", "E2", "E3", "E402", "E501", "E502", "E702", "E741", "F841", "W391"]

[lint.isort]
known-first-party = ["fractal"]
