name: gitnexus

# PR-only, same gitflow policy as CI.yml. Builds a throwaway knowledge-graph
# index on the runner, then maps the PR diff to indexed symbols and affected
# execution flows. Informational: the job reports what a change touches; it
# does not gate merging until explicit failure rules are added.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history so the PR base ref is available for compare scope.
        with:
          fetch-depth: 0

      # Parse cache (per-file parser output) is the cheap reusable part.
      # The graph DB itself is not cached: it is rebuilt from the cache and
      # the checked-out sources, and CI-generated artifacts are never stored
      # back into git.
      - name: Restore GitNexus parse cache
        uses: actions/cache@v4
        with:
          path: .gitnexus/parse-cache
          key: gitnexus-parse-cache-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            gitnexus-parse-cache-${{ runner.os }}-

      - name: Build GitNexus index
        run: npx -y gitnexus@1.6.12 analyze --index-only

      - name: Map PR diff to affected symbols and flows
        run: |
          node .gitnexus/run.cjs detect-changes \
            --scope compare \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --limit 100
